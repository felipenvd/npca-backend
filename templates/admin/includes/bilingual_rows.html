{% for row in rows %}
    <div class="border border-base-200 rounded-default p-3 mb-4 dark:border-base-800">
        {% for item in row.fields %}
            <div class="form-field group {% if item.field.errors %}errors{% endif %} flex flex-col gap-2 {% if not forloop.last %}mb-4{% endif %}">
                <label for="{{ item.field.id_for_label }}" class="block font-semibold text-important">
                    {{ item.field.label }} — {{ item.language }}{% if item.field.field.required %}<span class="text-red-600">*</span>{% endif %}
                </label>
                {{ item.field }}
                {% include "unfold/helpers/form_errors.html" with errors=item.field.errors %}
            </div>
        {% endfor %}
        {% include "unfold/helpers/help_text.html" with help_text=row.help_text %}
    </div>
{% endfor %}
